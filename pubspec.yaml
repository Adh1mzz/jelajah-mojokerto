name: jelajah_mojokerto
description: "Aplikasi katalog destinasi wisata di Mojokerto menggunakan Flutter dan Riverpod."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  google_fonts: ^9.0.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
